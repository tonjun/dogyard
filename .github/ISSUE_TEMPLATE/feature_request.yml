name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case first, then any syntax you have in mind. Please check the non-goals in docs/spec.md.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
