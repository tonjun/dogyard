name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small `flow.yaml` (and command used) that shows the problem. Remove any secrets.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DogYard version (`dogyard --version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: Node 22.4, macOS 15
    validations:
      required: true
