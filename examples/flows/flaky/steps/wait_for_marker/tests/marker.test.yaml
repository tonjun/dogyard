tests:
  - name: the marker path is templated into argv
    context:
      trigger: { marker: /tmp/some-marker }
    mock: { output: { ok: true, marker: /tmp/some-marker } }
    expect:
      argv: ["node", "../../bin/needs-marker.cjs", "/tmp/some-marker"]
      output: { ok: true, marker: /tmp/some-marker }

  - name: a missing marker fails with nonzero_exit
    context:
      trigger: { marker: /nonexistent/dogyard-marker }
    real: true
    expect:
      error_type: nonzero_exit
      attempts: 1
